{% extends 'base.html' %}
{% load crispy_forms_tags %} 

{% block conteudo %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            
            <div class="card shadow border-0">
                <div class="card-header bg-dark text-white p-3 text-center">
                    <h3 class="mb-0"><i ></i> Cadastro</h3>
                </div>
                
                <div class="card-body p-4">
                    <p class="text-muted">Preencha os dados abaixo para sua conta.</p>
                    
                    <form method="POST" action="">
                        {% csrf_token %} <div class="row">
                            <div class="col-md-6">
                                <h5 class="text-primary border-bottom pb-2 mb-3">Dados de Acesso</h5>
                                {{ userform|crispy }}
                            </div>

                            <div class="col-md-6">
                                <h5 class="text-primary border-bottom pb-2 mb-3">Dados Pessoais</h5>
                                {{ perfilform|crispy }}
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="#" class="text-secondary">Já tenho conta, quero entrar</a>
                            <button type="submit" class="btn btn-success btn-lg px-5 font-weight-bold">
                                Finalizar meu Cadastro
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
